<html>
<head>
    <title>Calculo de promedios</title>
</head>
<body>
    <h1>Ingrese los datos del alumno</h1>
    <form id="calificaciones">
        <label for="nombre">
            Nombre:
        </label>
        <input 
            type="text"
            id="nombre"
            required
        >
        <br><br>

        <label for="calif1">
            Calificacion 1:
        </label>
        <input 
            type="number"
            id="calif1"
            required
        >
        <br><br>

        <label for="calif2">
            Calificacion 2:
        </label>
        <input 
            type="number"
            id="calif2"
            required
        >
        <br><br>

        <label for="calif3">
            Calificacion 3:
        </label>
        <input 
            type="number"
            id="calif3"
            required
        >
        <br><br>

        <button type="submit">
            Validar datos
        </button>

        <hr>
        <h2>Resultados del alumno</h2>

        <div id="resultados">

        </div>

        <script src="app.js"></script>
    </form>
</body>
</html>
