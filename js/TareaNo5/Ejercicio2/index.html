<html>
<head>
    <title>Calculo de descuento</title>
</head>
<body>
    <h1>Ingrese los datos</h1>

    <form id="compra">
        <label for="nombre">
            Nombre:
        </label>
        <input 
            type="text"
            id="nombre"
            required
        >
        <br><br>

        <label for="monto">
            Monto de compra:
        </label>
        <input 
            type="number"
            id="monto"
            required
        >
        <br><br>

        <button type="submit">
            Pagar
        </button>

        <hr>
        <h2>Total de venta</h2>

        <div id="total">

        </div>
    </form>

    <script src="app.js"></script>
</body>
</html>
