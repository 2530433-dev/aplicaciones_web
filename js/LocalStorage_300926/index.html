<html lang="es">
<head>
    <title>PracticaLocalStorage</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>
<body>
    <main class="panel">
        <p class="eyebrow">Aplicaciones Web</p>
        <h1>Registro con Local Storage en Js</h1>
        <p id="estado"></p>
        <form id="formulario">
            <input name="nombre" placeholder="Nombre" required>
            <input 
                name="correo"
                type="email"
                placeholder="Correo"
                required
            />
            <input 
                name="telefono"
                placeholder="Telefono"
                maxlength="10"
                required
            >
            <input 
                name="ciudad"
                placeholder="Ciudad"
            >
            <select name="curso">
                <option value="">Seleccione una opcion</option>
                <option value="">Desarrollo web</option>
                <option value="">JavaScript</option>
                <option value="">Python</option>
            </select>

            <button type="submit">Registrar</button>
            <button type="button" id="borrar">Borrar</button>
        </form>
    </main>
</body>
</html>
