<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notas rapidas</title>

    <link rel="stylesheet" href="styles.css">

    <script src="app.js" defer></script>
</head>

<body>

    <main class="panel">

        <h1>Notas de aplicaciones web</h1>

        <form id="formulario">

            <input
                type="text"
                name="titulo"
                placeholder="Titulo"
                required
            >

            <textarea
                name="contenido"
                placeholder="Contenido de la nota"
                required
            ></textarea>

            <button id="guardarNota" type="submit">
                Guardar nota
            </button>

            <button
                id="cancelarEdicion"
                type="button"
                hidden
            >
                Cancelar edicion
            </button>

            <section id="notas"></section>

            <p
                id="estado"
                role="status"
                aria-live="polite"
            ></p>

        </form>

    </main>

</body>

</html>
